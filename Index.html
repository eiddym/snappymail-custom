<!DOCTYPE html>
<html class="rl-started-trigger">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="google" content="notranslate">
        <meta name="robots" content="noindex,nofollow,noodp">
        <meta name="theme-color" content="black">
        <title></title>
        <style id="app-boot-css">{{BaseAppBootCss}}</style>
        <link type="text/css" rel="stylesheet" href="{{BaseAppMainCssLink}}">
        <link rel="manifest" href="{{BaseAppManifestLink}}">
        <link rel="icon" href="{{BaseFavIconSvg}}" type="image/svg+xml">
        <style id="app-theme-style" data-name="{{BaseAppThemeName}}">{{BaseAppThemeCss}}</style>
        {{BaseAppFaviconPngLinkTag}}
        {{BaseAppFaviconTouchLinkTag}}
</head>
<body id="rl-app" data-admin='{{BaseAppAdmin}}' spellcheck="false">
        <div id="rl-loading">
                <div id="rl-loading-desc">{{LoadingDescriptionEsc}}</div>
                <i class="icon-spinner"></i>
                <noscript><div class="error-desc">{{NO_SCRIPT_DESC}}</div></noscript>
        </div>
        <div id="rl-loading-error" hidden="">An error occurred.<br>Please refresh the page and try again.<br></div>
        <div id="rl-BadBrowser" hidden="">
                <h1>{{BAD_BROWSER_TITLE}}</h1>
                <div class="error-desc">{{BAD_BROWSER_DESC}}</div>
        </div>
        <div id="rl-NoCookie" hidden="">
                <h1>{{NO_COOKIE_TITLE}}</h1>
                <div class="error-desc">{{NO_COOKIE_DESC}}</div>
        </div>
        <div id="rl-content" hidden="">
                <div id="rl-left"></div>
                <div id="rl-right"></div>
        </div>
        <div id="rl-popups"></div>
        {{BaseTemplates}}
        <script nonce="" type="text/javascript">{{BaseAppBootScript}}{{BaseLanguage}}</script>
        <script type="text/javascript">
        window.togglePasswordNode = function(eyeSpan) {
            if (!eyeSpan) return false;
            var container = eyeSpan.closest ? eyeSpan.closest('.controls') : eyeSpan.parentElement;
            var p = container ? container.querySelector('input') : document.querySelector('input[name="Password"]');
            if (!p) return false;

            var val = p.value;
            var isPassword = (p.type === 'password' || p.getAttribute('type') === 'password');
            var targetType = isPassword ? 'text' : 'password';

            var newInput = document.createElement('input');
            newInput.name = p.name || 'Password';
            newInput.required = p.required;
            newInput.className = p.className || 'input-block-level';
            newInput.autocomplete = p.autocomplete || 'current-password';
            newInput.placeholder = p.placeholder || 'Contraseña';
            newInput.type = targetType;
            newInput.setAttribute('type', targetType);
            newInput.value = val;

            if (p.getAttribute('data-bind')) {
                newInput.setAttribute('data-bind', p.getAttribute('data-bind'));
            }

            p.parentNode.replaceChild(newInput, p);

            try {
                newInput.focus();
                if (newInput.setSelectionRange) {
                    newInput.setSelectionRange(val.length, val.length);
                }
            } catch(err) {}

            if (targetType === 'text') {
                eyeSpan.style.color = '#ffffff';
                eyeSpan.style.opacity = '1';
                eyeSpan.style.textShadow = '0 0 12px rgba(255,255,255,0.9)';
            } else {
                eyeSpan.style.color = 'rgba(243, 234, 215, 0.65)';
                eyeSpan.style.opacity = '0.7';
                eyeSpan.style.textShadow = 'none';
            }
            return false;
        };

        document.addEventListener('click', function(e) {
            var target = e.target;
            var eye = target && target.closest ? target.closest('.snappy-eye-toggle') : null;
            if (eye) {
                e.preventDefault();
                e.stopPropagation();
                window.togglePasswordNode(eye);
            }
        }, true);
        </script>
</body>
</html>
