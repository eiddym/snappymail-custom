<!DOCTYPE html>
<html class="rl-started-trigger">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="google" content="notranslate">
        <meta name="robots" content="noindex,nofollow,noodp">
        <meta name="theme-color" content="black">
        <title></title>
        <style id="app-boot-css">{{BaseAppBootCss}}</style>
        <link type="text/css" rel="stylesheet" href="{{BaseAppMainCssLink}}">
        <link rel="manifest" href="{{BaseAppManifestLink}}">
        <link rel="icon" href="{{BaseFavIconSvg}}" type="image/svg+xml">
        <style id="app-theme-style" data-name="{{BaseAppThemeName}}">{{BaseAppThemeCss}}</style>
        {{BaseAppFaviconPngLinkTag}}
        {{BaseAppFaviconTouchLinkTag}}
</head>
<body id="rl-app" data-admin='{{BaseAppAdmin}}' spellcheck="false">
        <div id="rl-loading">
                <div id="rl-loading-desc">{{LoadingDescriptionEsc}}</div>
                <i class="icon-spinner"></i>
                <noscript><div class="error-desc">{{NO_SCRIPT_DESC}}</div></noscript>
        </div>
        <div id="rl-loading-error" hidden="">An error occurred.<br>Please refresh the page and try again.<br></div>
        <div id="rl-BadBrowser" hidden="">
                <h1>{{BAD_BROWSER_TITLE}}</h1>
                <div class="error-desc">{{BAD_BROWSER_DESC}}</div>
        </div>
        <div id="rl-NoCookie" hidden="">
                <h1>{{NO_COOKIE_TITLE}}</h1>
                <div class="error-desc">{{NO_COOKIE_DESC}}</div>
        </div>
        <div id="rl-content" hidden="">
                <div id="rl-left"></div>
                <div id="rl-right"></div>
        </div>
        <div id="rl-popups"></div>
        {{BaseTemplates}}
        <script nonce="" type="text/javascript">{{BaseAppBootScript}}{{BaseLanguage}}</script>
        <script type="text/javascript">
        window.doTogglePassword = function(spanElement) {
            if (!spanElement) return false;
            var parent = spanElement.closest ? spanElement.closest('.controls') : spanElement.parentElement;
            var pwdInput = parent ? (parent.querySelector('input[name="Password"]') || parent.querySelector('input')) : document.querySelector('input[name="Password"]');
            if (!pwdInput) return false;

            var currentType = pwdInput.getAttribute('type') || pwdInput.type;
            var isPassword = (currentType === 'password');
            var newType = isPassword ? 'text' : 'password';

            pwdInput.type = newType;
            pwdInput.setAttribute('type', newType);
            pwdInput.style.setProperty('-webkit-text-security', isPassword ? 'none' : 'disc', 'important');
            pwdInput.style.setProperty('text-security', isPassword ? 'none' : 'disc', 'important');

            if (isPassword) {
                spanElement.style.color = '#ffffff';
                spanElement.style.opacity = '1';
                spanElement.style.textShadow = '0 0 10px rgba(255,255,255,0.9)';
            } else {
                spanElement.style.color = 'rgba(243, 234, 215, 0.65)';
                spanElement.style.opacity = '0.7';
                spanElement.style.textShadow = 'none';
            }
            return false;
        };
        </script>
</body>
</html>
