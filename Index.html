<!DOCTYPE html>
<html class="rl-started-trigger">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="google" content="notranslate">
        <meta name="robots" content="noindex,nofollow,noodp">
        <meta name="theme-color" content="black">
        <title></title>
        <style id="app-boot-css">{{BaseAppBootCss}}</style>
        <link type="text/css" rel="stylesheet" href="{{BaseAppMainCssLink}}">
        <link rel="manifest" href="{{BaseAppManifestLink}}">
        <link rel="icon" href="{{BaseFavIconSvg}}" type="image/svg+xml">
        <style id="app-theme-style" data-name="{{BaseAppThemeName}}">{{BaseAppThemeCss}}</style>
        {{BaseAppFaviconPngLinkTag}}
        {{BaseAppFaviconTouchLinkTag}}
</head>
<body id="rl-app" data-admin='{{BaseAppAdmin}}' spellcheck="false">
        <div id="rl-loading">
                <div id="rl-loading-desc">{{LoadingDescriptionEsc}}</div>
                <i class="icon-spinner"></i>
                <noscript><div class="error-desc">{{NO_SCRIPT_DESC}}</div></noscript>
        </div>
        <div id="rl-loading-error" hidden="">An error occurred.<br>Please refresh the page and try again.<br></div>
        <div id="rl-BadBrowser" hidden="">
                <h1>{{BAD_BROWSER_TITLE}}</h1>
                <div class="error-desc">{{BAD_BROWSER_DESC}}</div>
        </div>
        <div id="rl-NoCookie" hidden="">
                <h1>{{NO_COOKIE_TITLE}}</h1>
                <div class="error-desc">{{NO_COOKIE_DESC}}</div>
        </div>
        <div id="rl-content" hidden="">
                <div id="rl-left"></div>
                <div id="rl-right"></div>
        </div>
        <div id="rl-popups"></div>
        {{BaseTemplates}}
        <script nonce="" type="text/javascript">{{BaseAppBootScript}}{{BaseLanguage}}</script>
        <script type="text/javascript">
        function handleEyeToggle(e) {
            var target = e.target;
            var eye = target && target.closest ? target.closest('.snappy-eye-toggle') : null;
            if (eye) {
                e.preventDefault();
                e.stopPropagation();
                var container = eye.closest('.controls') || eye.parentElement;
                var pwdInput = container ? container.querySelector('input') : document.querySelector('input[name="Password"]');
                if (pwdInput) {
                    var currentType = pwdInput.getAttribute('type') || pwdInput.type;
                    var isPassword = (currentType === 'password');
                    if (isPassword) {
                        pwdInput.type = 'text';
                        pwdInput.setAttribute('type', 'text');
                        pwdInput.style.setProperty('-webkit-text-security', 'none', 'important');
                        pwdInput.style.setProperty('text-security', 'none', 'important');
                        eye.style.color = '#ffffff';
                        eye.style.opacity = '1';
                        eye.style.textShadow = '0 0 12px rgba(255,255,255,0.9)';
                    } else {
                        pwdInput.type = 'password';
                        pwdInput.setAttribute('type', 'password');
                        pwdInput.style.setProperty('-webkit-text-security', 'disc', 'important');
                        pwdInput.style.setProperty('text-security', 'disc', 'important');
                        eye.style.color = 'rgba(243, 234, 215, 0.65)';
                        eye.style.opacity = '0.7';
                        eye.style.textShadow = 'none';
                    }
                }
            }
        }
        document.addEventListener('click', handleEyeToggle, true);
        document.addEventListener('pointerdown', function(e) {
            if (e.target && e.target.closest && e.target.closest('.snappy-eye-toggle')) {
                handleEyeToggle(e);
            }
        }, true);
        </script>
</body>
</html>
