<div style="text-align: center; margin-bottom: 16px;">
        <img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=375,fit=crop/1EdidoQhwln867gG/disea--o-sin-tatulo-VuRHqfOszoZxhEbq.png" alt="Sello Marabunta R.L." style="width: 175px; height: 175px; display: block; margin: 0 auto; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.65)); object-fit: contain;">
</div>
<div class="descWrapper" data-bind="visible: '' !== loadingDesc, text: loadingDesc"></div>
<div class="alert" data-bind="visible: '' !== submitError()" style="margin-bottom: 16px; border-radius: 12px;">
        <a href="#" class="close" data-bind="click: hideError">×</a>
        <span data-bind="text: submitError"></span>
        <p data-bind="visible: '' !== submitErrorAdditional()">
                <span data-i18n="GLOBAL/SERVER_MESSAGE"></span>:
                <!-- ko text: submitErrorAdditional --><!-- /ko -->
        </p>
</div>
<form action="#/" spellcheck="false" method="POST"
        data-bind="submit: submitForm, css: {'errorAnimated': formError, 'submitting': submitRequest()}">
        
        <div class="controls" data-bind="css: {'error': emailError}" style="position: relative; margin-bottom: 18px;">
                <input name="Email" required="" type="text" class="input-block-level" pattern="[^@\s]+(@[^\s]+)?" inputmode="email"
                        autofocus="" autocomplete="email" autocorrect="off" autocapitalize="off"
                        data-bind="textInput: email, disable: submitRequest"
                        placeholder="ariel.ayaviri@marabuntarl.com">
        </div>

        <div class="controls" data-bind="css: {'error': passwordError}" style="position: relative; margin-bottom: 10px;">
                <input name="Password" required="" type="password" class="input-block-level"
                        autocomplete="current-password" autocorrect="off" autocapitalize="off"
                        data-bind="textInput: password, disable: submitRequest"
                        placeholder="Contraseña">
                <span class="snappy-eye-toggle" title="Mostrar / Ocultar contraseña">👁</span>
        </div>

        <div style="text-align: right; margin-bottom: 22px;">
                <a href="#" onclick="alert('Contacte al administrador de su servidor de correo para restablecer su contraseña.'); return false;" style="color: rgba(243, 234, 215, 0.75); font-size: 13px; text-decoration: underline;">¿Olvidaste tu contraseña?</a>
        </div>

        <div id="plugin-Login-BottomControlGroup"></div>

        <div class="controls" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                <div class="e-checkbox" tabindex="0" data-bind="toggle: signMe" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <i role="checkbox" class="fontastic" data-bind="text: signMe() ? '☑' : '☐'" style="font-size: 18px;"></i>
                        <span data-i18n="LOGIN/LABEL_SIGN_ME" style="font-size: 14px;">Recuérdame</span>
                </div>
                <div class="language-buttons">
                        <a href="#" class="language-button fontastic" style="font-size: 18px; color: rgba(243, 234, 215, 0.75);"
                                data-bind="visible: allowLanguagesOnLogin, click: selectLanguage, css: { 'icon-spinner' : langRequest }"
                                data-i18n="[title]POPUPS_LANGUAGES/TITLE_LANGUAGES">
                                🌍
                        </a>
                </div>
        </div>

        <div>
                <button class="btn btn-large buttonLogin"
                        data-bind="command: submitCommand"
                        style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <span>ACCEDER</span>
                        <span style="font-size: 18px;">→</span>
                </button>
        </div>

        <div style="text-align: center; margin-top: 24px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 12px; letter-spacing: 0.8px; color: rgba(243, 234, 215, 0.6);">
                🛡 Seguro • Privado • Institucional
        </div>
</form>
